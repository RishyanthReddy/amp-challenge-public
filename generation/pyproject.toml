[project]
name = "amp-challenge-generation-runtime"
version = "0.1.0"
description = "Pinned local CUDA runtime for the submitted ProGen2 sampling schedules"
requires-python = ">=3.10,<3.11"
dependencies = [
    "torch==2.5.1",
    "transformers==4.46.3",
    "tokenizers==0.20.3",
    "numpy==1.26.4",
    "pandas==2.2.3",
]

[tool.uv]
package = false

[tool.uv.sources]
torch = { index = "pytorch-cu124" }

[[tool.uv.index]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
explicit = true
