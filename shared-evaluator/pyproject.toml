[project]
name = "amp-challenge-shared-evaluator"
version = "0.1.0"
description = "Shared AMP activity and safety evaluation models"
requires-python = ">=3.11,<3.13"
dependencies = [
    "joblib>=1.3,<2",
    "levenshtein>=0.25,<1",
    "numpy>=1.26,<3",
    "pandas>=2.0,<4",
    "pyarrow>=14,<25",
    "scikit-learn>=1.4,<2",
]

[dependency-groups]
dev = ["pytest>=8,<9"]

[tool.uv]
package = false
