[project]
name = "amp-challenge-portfolio-selection"
version = "0.1.0"
description = "MAP-Elites, constrained DPP selection, and submission packaging"
requires-python = ">=3.11,<3.13"
dependencies = [
    "levenshtein>=0.25,<1",
    "numpy>=1.26,<3",
    "pandas>=2.0,<4",
    "pyarrow>=14,<25",
    "scipy>=1.11,<2",
]

[dependency-groups]
dev = ["pytest>=8,<9"]

[tool.uv]
package = false
